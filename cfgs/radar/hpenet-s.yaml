# Model Information
# GFLOPs  GMACs   Params.(M)
#  3.64    1.79    0.792
# Throughput (ins./s): 226.73038739659074 

model:
  NAME: BaseSeg
  encoder_args:
    NAME: HPENetV2Encoder
    blocks: [1, 1, 1, 1, 1]
    strides: [1, 4, 4, 4, 4]
    sa_layers: 2 
    sa_use_res: False 
    width: 32
    in_channels: 4
    expansion: 1 #4
    radius: 0.1
    nsample: 32
    aggr_args:
      feature_type: 'dp_fj'
      reduction: 'max'
    group_args:
      NAME: 'ballquery'
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: 'relu'
    norm_args:
      norm: 'in'
  decoder_args:
    NAME: HPENetV2Decoder
  cls_args:
    NAME: SegHead
    num_classes: 2
    in_channels: null
    norm_args:
      norm: 'in'

